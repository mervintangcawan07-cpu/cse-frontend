name: Production Readiness Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Typecheck, Audit & Build
    runs-on: ubuntu-latest
    env:
      # CI-only placeholders: no live DB access and no production secrets required.
      # Prisma client generation and static compilation should not query Postgres.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/govstudyx_ci"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/govstudyx_ci"
      JWT_SECRET: "ci-only-placeholder-not-used-in-production-please-never-deploy"
      NEXT_PUBLIC_APP_URL: "https://govstudyx.com"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate Next.js Type Declarations
        run: npx next typegen

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Route Security & Query Cap Audit
        run: npx tsx src/scripts/audit-routes.ts

      - name: Production Build
        run: npm run build

      - name: Client Bundle Secret Exposure Scan
        run: npx tsx src/scripts/audit-bundle-secrets.ts
